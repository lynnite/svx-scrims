- type: entity
  parent: [RMCBaseSlideMagazineVisuals, CMWeaponPistolBase]
  id: SVXWeaponFlintlock
  name: "flintlock pistol"
  description: A high-powered flintlock pistol. Made for unarmored targets.
  suffix: Filled
  components:
  - type: RMCSelectiveFire
    scatterWielded: 10
    scatterUnwielded: 14
    baseFireRate: 0.3
  - type: GunDamageModifier
    multiplier: 1.4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 1
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_kt42.ogg
  - type: PumpAction
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Cock/gun_pistol_cocked.ogg
    examine: rmc-gun-rack-examine
    popup: rmc-gun-rack-first
    popupKey: rmc-gun-rack-first-with
    once: true
  - type: Sprite
    sprite: _SVX/Objects/Weapons/Guns/Pistols/flintlock.rsi
  - type: Clothing
    sprite: _SVX/Objects/Weapons/Guns/Pistols/flintlock.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: SVXMagazinePistolFlintlock
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
        priority: 2
        whitelist:
          tags:
          - SVXMagazinePistolFlintlock
  - type: Tag
    tags:
    - Sidearm
    - SVXFlintlockPistol

- type: entity
  parent: CMBaseMagazinePistol
  id: SVXMagazinePistolFlintlock
  name: flintlock loading kit
  description: A loading kit for the flintlock.
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - SVXMagazinePistolFlintlock
  - type: Item
    size: Tiny
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - SVXCartridgePistolFlintlock
    proto: SVXCartridgePistolFlintlock
    capacity: 10
  - type: Sprite
    sprite: _SVX/Objects/Weapons/Guns/Ammunition/Magazines/flintlock.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMCartridgePistolBase
  id: SVXCartridgePistolFlintlock
  name: Cartridge (flintlock)
  components:
  - type: Tag
    tags:
    - Cartridge
    - SVXCartridgePistolFlintlock
  - type: CartridgeAmmo
    proto: SVXBulletPistolFlintlock

- type: entity
  parent: RMCBaseBullet
  id: SVXBulletPistolFlintlock
  name: high-powered flintlock bullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 110
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 4
      falloff: 6
  - type: CMArmorPiercing
    amount: 5
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 5
      falloff: 10

- type: Tag
  id: SVXMagazinePistolFlintlock

- type: Tag
  id: SVXCartridgePistolFlintlock

- type: Tag
  id: SVXFlintlockPistol
