- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: SVX-40 energy smg
  id: SVXWeaponEnergySMG
  description: An energy submachinegun of alien origin. It is not known who manufactured it, but it reads SVX on the side of the gun.
  components:
  - type: Sprite
    sprite: _SVX/Objects/Weapons/Guns/Energy/energysmg.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _SVX/Objects/Weapons/Guns/Energy/energysmg.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
  - type: RMCSelectiveFire
    scatterWielded: 26
    scatterUnwielded: 26
    baseFireRate: 7.4
    baseFireModes:
    - SemiAuto
    modifiers:
      Burst:
        useBurstScatterMult: false
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.6
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 2
  - type: WieldDelay
    baseDelay: 0.05
  - type: WieldableSpeedModifiers
    base: 1
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_unload.ogg
        priority: 2
        whitelist:
          tags:
          - SVXMagazinePlasmaExtended
          - SVXMagazinePlasma
  - type: GunDamageModifier
    multiplier: 0.85
  - type: Tag
    tags:
    - SVXWeaponEnergySMG

- type: entity
  parent: CMMagazineRifleBase
  id: SVXMagazinePlasmaExtended
  name: "Extended energy magazine"
  description: "A 64-round magazine of standard plasma rounds."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - SVXMagazinePlasmaExtended
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - SVXCartridgeEnergy
    proto: SVXCartridgeEnergy
    capacity: 64
  - type: Sprite
    sprite: _SVX/Objects/Weapons/Guns/Ammunition/Magazines/energymagazine.rsi

- type: Tag
  id: SVXMagazinePlasmaExtended

- type: Tag
  id: SVXWeaponEnergySMG