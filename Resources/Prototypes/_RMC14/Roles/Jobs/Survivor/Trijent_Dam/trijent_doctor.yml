- type: job
  parent: CMSurvivorDoctor
  id: CMSurvivorTrijentDoctor
  name: cm-job-name-survivor-trijent-doctor
  description: cm-job-description-survivor
  startingGear: RMCGearSurvivorTrijentDoctor
  spawnMenuRoleName: Trijent Doctor (Trijent Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      preset: RMCSkillPresetSurvivorDoctor
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: RMCAllowSuitStorage
    - type: EquipSurvivorPreset
      preset: RMCGearSurvivorPresetTrijentDoctor
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: icc
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_cmb
  useLoadoutOfJob: CMSurvivorDoctor # for inheritance

- type: startingGear
  parent: RMCGearSurvivorDoctor
  id: RMCGearSurvivorTrijentDoctor
  equipment:
    head: CMHeadCapSurgBlue
    shoes: RMCShoesWhite
    jumpsuit: CMScrubsBlue

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSurvivorTrijentDoctor
  name: survivor trijent doctor spawn point
  components:
  - type: SpawnPoint
    job_id: CMSurvivor
  - type: Sprite
    layers:
    - sprite: _RMC14/Markers/landmarks.rsi
      state: surv

- type: entity
  parent: RMCSurvivorPresetDoctor
  id: RMCGearSurvivorPresetTrijentDoctor
  name: trijent doctor colonist preset
  categories: [ HideSpawnMenu ]
