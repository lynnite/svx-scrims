- type: job
  parent: RMCSurvivorSPPSOFBase
  id: RMCSurvivorSPPSOFSoldier
  name: rmc-job-name-soro-sof-soldier
  icon: "RMCJobIconSPPRifleman"
  spawnMenuRoleName: SPP SOF Rifleman (Sorokyne Special Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - Russian
      - English
      - German
      - Chinese
      understoodLanguages:
      - Russian
      - English
      - German
      - Chinese
      currentLanguage: Russian
      defaultLanguage: Russian
    - type: RMCAllowSuitStorage
    - type: RMCSurvivor
    - type: NpcFactionMember
      factions:
      - SPP
    - type: Skills
      preset: RMCSkillPresetSurvivorSPPPrivate
    - type: JobPrefix
      prefix: rmc-job-prefix-soro-sof-soldier
    - type: AssignSquad
      squad: SquadSPP
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: icc
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_cmb
  hidden: true

- type: entity
  parent: CMSpawnPointJobBase
  id: CMSpawnPointSPPSOFRifleman
  name: special survivor spp sof rifleman spawn point
  components:
  - type: SpawnPoint
    job_id: RMCSurvivorSPPSOFSoldier
  - type: Sprite
    state: surv_spp
