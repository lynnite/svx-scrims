- type: entity
  id: SVXBaseVehicleStrap
  abstract: true
  components:
  - type: Sprite
    noRot: true
  - type: InputMover
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Physics
    bodyType: KinematicController
  - type: Vehicle
  - type: LagCompensation
  - type: StrapVehicle
  - type: Strap
  - type: MovementSpeedModifier
    weightlessModifier: 0
    acceleration: 2
    friction: 2
    frictionNoInput: 6
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 360
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Damageable
    damageContainer: StructuralMarine
    damageModifierSet: StructuralMarine

- type: entity
  id: SVXVehicleJanicart
  parent: SVXBaseVehicleStrap
  name: survivor janicart
  description: The janitor's trusty steed.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/janicart.rsi
    drawdepth: Mobs
    layers:
    - state: vehicle
      map: ["movement"]
  - type: SpriteMovement
    movementLayers:
      movement:
        state: vehicle
    noMovementLayers:
      movement:
        state: vehicle
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - SVXJanicartKeys
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3.5
    softness: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Strap
    buckleOffset: "0.01,0.15"
    modifyBuckleDrawDepth: false
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          tags:
          - SVXJanicartKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
  - type: ContainerContainer
    containers:
      key_slot: !type:ContainerSlot
  - type: SpawnFireOnDestroy
    range: 1
    intensity: 20
    duration: 15
    spawn: RMCTileFire
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 100
  - type: Explosive
    maxIntensity: 40 # max 100 brute, 100 burn
    intensitySlope: 6
    totalIntensity: 200
    canCreateVacuum: false
    explosionType: RMC
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: CMExplosionEffect
  - type: RMCScorchEffect
  - type: ReagentTank
    tankType: Fuel

- type: entity
  parent: SVXVehicleJanicart
  id: SVXVehicleHorse
  name: horse
  description: A horse is a large, four-legged mammal that has been domesticated for thousands of years. It is known for its speed, strength, and endurance, making it an ideal animal for transportation and work. Horses come in a variety of breeds, each with its own unique characteristics and abilities. They are herbivores and primarily feed on grass and hay. Horses have a strong social structure and often form close bonds with their owners and other horses. They are also used in various sports and recreational activities, such as racing, jumping, and dressage. 
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/horse.rsi
    drawdepth: Mobs
    layers:
    - state: vehicle
      map: ["movement"]
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          tags:
          - SVXHorseKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - SVXHorseKeys
  - type: SpawnFireOnDestroy
    range: 1
    intensity: 20
    duration: 15
    spawn: RMCTileFire
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 100
  - type: Explosive
    maxIntensity: 40 # max 100 brute, 100 burn
    intensitySlope: 6
    totalIntensity: 200
    canCreateVacuum: false
    explosionType: RMC
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: CMExplosionEffect
  - type: RMCScorchEffect
  - type: ReagentTank
    tankType: Fuel

- type: entity
  parent: SVXVehicleKeyJanicart
  id: SVXHorseKeys
  name: horse keys
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/wheat.rsi
    state: produce
  - type: Tag
    tags: [ SVXHorseKeys ]

- type: entity
  parent: BaseItem
  id: SVXVehicleKeyJanicart
  name: survivor janicart keys
  description: Interesting design.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/janicart.rsi
    state: keys
  - type: Item
    size: Small
  - type: Tag
    tags: [ SVXJanicartKeys ]

- type: Tag
  id: SVXHorseKeys

- type: Tag
  id: SVXJanicartKeys