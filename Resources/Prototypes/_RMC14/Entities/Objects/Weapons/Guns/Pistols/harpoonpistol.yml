- type: entity
  parent: [RMCBaseSlideMagazineVisuals, CMWeaponPistolBase]
  id: SVXWeaponPistolHarpoon
  name: "Harpoon 'high-power' automagnum"
  description: A high-powered harpoon pistol. Fires harpoon rounds, which are capable of piercing through armor and flesh alike.
  suffix: Filled
  components:
  - type: RMCSelectiveFire
    scatterWielded: 10
    scatterUnwielded: 14
    baseFireRate: 0.3
  - type: GunDamageModifier
    multiplier: 1.4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.1
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_kt42.ogg
  - type: PumpAction
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Cock/gun_pistol_cocked.ogg
    examine: rmc-gun-rack-examine
    popup: rmc-gun-rack-first
    popupKey: rmc-gun-rack-first-with
    once: true
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/harpoonpistol.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Pistols/harpoonpistol.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: SVXMagazinePistolHarpoon
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
        priority: 2
        whitelist:
          tags:
          - SVXMagazinePistolHarpoon
  - type: AttachableHolder
    slots:
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBurstFireAssembly
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.312, -0.25
  - type: Tag
    tags:
    - Sidearm
    - SVXHarpoonPistol

- type: entity
  parent: CMBaseMagazinePistol
  id: SVXMagazinePistolHarpoon
  name: Harpoon magazine
  description: A harpoon pistol magazine.
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - SVXMagazinePistolHarpoon
  - type: Item
    size: Tiny
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - SVXCartridgePistolHarpoon
    proto: SVXCartridgePistolHarpoon
    capacity: 3
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/mk45.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMCartridgePistolBase
  id: SVXCartridgePistolHarpoon
  name: Cartridge (harpoon)
  components:
  - type: Tag
    tags:
    - Cartridge
    - SVXCartridgePistolHarpoon
  - type: CartridgeAmmo
    proto: SVXBulletPistolHarpoon

- type: entity
  parent: RMCBaseBullet
  id: SVXBulletPistolHarpoon
  name: high-powered harpoon bullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 130
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 4
      falloff: 6
  - type: CMArmorPiercing
    amount: 25
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 5
      falloff: 10
  - type: RMCStunOnHit
    stuns:
    - whitelist:
        minMobSize: VerySmallXeno
      maxRange: 3
      slowTime: 4
      stunTime: 1

- type: Tag
  id: SVXMagazinePistolHarpoon

- type: Tag
  id: SVXCartridgePistolHarpoon

- type: Tag
  id: SVXHarpoonPistol
