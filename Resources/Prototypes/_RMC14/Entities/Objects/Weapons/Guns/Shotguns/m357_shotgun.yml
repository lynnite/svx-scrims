- type: entity
  parent: [ RMCBaseBreechloader, RMCBaseAttachableHolder ]
  name: M357 Rival
  id: WeaponShotgunM357
  description: A double barrel shotgun produced by AEGIS. Archaic, sturdy, affordable. Only holds two 12g shells at a time.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/doublebarrel.rsi
  - type: ShootUseDelay
  - type: BreechLoaded
    openSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg
    closeSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Shotguns/doublebarrel.rsi
  - type: BallisticAmmoProvider
    cycleable: true
    whitelist:
      tags:
      - RMCShellShotgunSlugs
      - RMCShellShotgunIncendiary
      - RMCShellShotgunBeanbag
      - RMCShellShotgunFlechette
      - SVXShellShotgunBirdshot
    capacity: 2
  - type: RMCSelectiveFire
    scatterWielded: 10
    scatterUnwielded: 20
    baseFireRate: 0.7
    baseFireModes:
    - SemiAuto
    - Burst
    burstFireRateMultiplier: 10
    modifiers:
      Burst:
        # fireDelay: 0.01
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
  - type: Gun
    shotsPerBurst: 2
    burstCooldown: 0.5
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_shotgun_heavy.ogg
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.45
    accuracyMultiplierUnwielded: 0.5
  - type: Construction
    graph: M357Sawn
    node: start
    deconstructionTarget: null
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-stock:
        startingAttachable: RMCAttachmentDoubleBarrelShotgunStock
        whitelist:
          tags:
          - RMCAttachmentDoubleBarrelShotgunStock
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentBurstFireAssembly
        random:
        - RMCAttachmentBurstFireAssembly
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.81, 0.06
      rmc-aslot-rail: -0.025, 0.09
      rmc-aslot-stock: -0.55, -0.05
      rmc-aslot-underbarrel: 0.25, -0.31
  - type: Tag
    tags:
    - RMCWeaponShotgunM357
    - RMCWeaponShotgun

- type: Tag
  id: RMCWeaponShotgunM357
