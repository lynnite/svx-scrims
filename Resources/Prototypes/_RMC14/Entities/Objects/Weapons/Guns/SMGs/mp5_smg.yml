- type: entity
  parent: CMBaseWeaponSMG
  name: MP5 submachinegun
  id: WeaponSMGMP5
  description: A German design, this was one of the most widely used submachine guns in the world. It's still possible to find this firearm in the hands of collectors or gun fanatics.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/mp5.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/mp5.rsi
  - type: RMCSelectiveFire
    scatterWielded: 6
    scatterUnwielded: 8
    baseFireRate: 4
    baseFireModes:
    - SemiAuto
    - Burst
    burstFireRateMultiplier: 5
    modifiers:
      Burst:
        # fireDelay: 0.01
        maxScatterModifier: 6
        useBurstScatterMult: false
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
  - type: Gun
    burstCooldown: 0.75
    selectedMode: Burst
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/smg_light.ogg
    availableModes:
    - SemiAuto
    - Burst
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.8
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CMMagazineSMGMP5
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineSMGMP5
  - type: AttachableHolder
    randomAttachmentChance: 0.1
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
          - RMCAttachmentTerminator
        random:
          - RMCAttachmentTerminator
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentBipod
          - RMCAttachmentM203GrenadeLauncher
          - RMCAttachmentUnderbarrelExtinguisher
        random:
        - RMCAttachmentM203GrenadeLauncher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.84, 0
      rmc-aslot-rail: 0.032, 0.09
      rmc-aslot-underbarrel: 0.45, -0.31
  - type: GunDamageModifier
    multiplier: 1.2

- type: entity
  parent: WeaponSMGMP5
  name: MP5K submachinegun
  id: WeaponSMGMP5K
  description: An ultra-compact, 9x19mm submachine gun developed in the 1970s for close-quarters battle and VIP protection.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/mp5.rsi
    layers:
    - state: mp5kbase
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/SMGs/mp5.rsi
  - type: AttachableHolder
    randomAttachmentChance: 0.1
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
          - RMCAttachmentTerminator
        random:
          - RMCAttachmentTerminator
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        startingAttachable: RMCAttachmentMP5KVerticalGrip
        whitelist:
          tags:
          - RMCAttachmentMP5KVerticalGrip
  - type: Tag
    tags:
    - RMCWeaponSMG
    - WeaponSMGMP5K
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.84, 0
      rmc-aslot-rail: 0.032, 0.09
      rmc-aslot-underbarrel: 0.45, -0.24

- type: entity
  parent: CMMagazineRifleBase
  id: CMMagazineSMGMP5
  name: "MP5 magazine (9mm)"
  description: "A 9mm magazine for the MP5."
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - CMMagazineSMGMP5
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridge9mmSMG
    proto: CMCartridge9mmSMG
    capacity: 30
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/mp5.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance
  - type: Item
    size: Small

- type: entity
  parent: CMCartridge10x20mm
  id: CMCartridge9mmSMG
  name: cartridge (9mm SMG)
  description: A 9mm cartridge for the mp5 submachinegun.
  components:
  - type: Tag
    tags:
    - Cartridge
    - CMCartridge9mmSMG
  - type: CartridgeAmmo
    proto: CMBullet9mmSMG

- type: entity
  parent: Bullet10x20mm
  id: CMBullet9mmSMG #Yes it does use a seperate type of 9mm thats mechanically identical to 10x20mm for some reason
  categories: [ HideSpawnMenu ]

- type: Tag
  id: CMMagazineSMGMP5

- type: Tag
  id: CMCartridge9mmSMG

- type: Tag
  id: WeaponSMGMP5K