- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: SVX-294 energy rifle
  id: SVXWeaponAlienRifle
  description: An energy rifle of alien origin. It is not known who manufactured it, but it reads SVX on the side of the gun.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Energy/energyrifle.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Energy/energyrifle.rsi
  - type: Gun
    shotsPerBurst: 2
    burstCooldown: 0.4
    burstFireRateMultiplier: 5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    recoilUnwielded: 2
    scatterWielded: 6
    baseFireRate: 4.1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.6
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0
  - type: WieldDelay
    baseDelay: 0.1
  - type: WieldableSpeedModifiers
    base: 0.875
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_unload.ogg
        priority: 2
        whitelist:
          tags:
          - SVXMagazinePlasma
  - type: GunDamageModifier
    multiplier: 1
  - type: Tag
    tags:
    - SVXWeaponAlienRifle

- type: entity
  parent: CMMagazineRifleBase
  id: SVXMagazinePlasma
  name: "Energy rifle magazine"
  description: "A 40-round magazine of standard plasma rounds."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - SVXMagazinePlasma
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - SVXProjectileEnergy
    proto: SVXCartridgeEnergy
    capacity: 40
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/alienrifle.rsi

- type: entity
  parent: CMBaseCartridgeRifle
  id: SVXCartridgeEnergy
  name: Cartridge (plasma)
  components:
  - type: Tag
    tags:
    - Cartridge
    - SVXCartridgeEnergy
  - type: CartridgeAmmo
    proto: SVXProjectileEnergy

- type: entity
  parent: RMCBaseBullet
  id: SVXProjectileEnergy
  categories: [ HideSpawnMenu ]
  name: energy bolt
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/stun_projectiles.rsi
    layers:
    - state: stun
      shader: unshaded
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      path: /Audio/_RMC14/Bullets/energy_miss1.ogg
      params:
        volume: 5
  - type: Projectile
    damage:
      types:
        Piercing: 34
        Heat: 6
  - type: RMCProjectileAccuracy
    accuracy: 100

- type: Tag
  id: SVXWeaponAlienRifle

- type: Tag
  id: SVXCartridgeEnergy

- type: Tag
  id: SVXProjectileEnergy

- type: Tag
  id: SVXMagazinePlasma