- type: entity
  parent: SVXWeaponAlienRifle
  name: SVX-103 energy revolver
  id: SVXWeaponAlienRevolver
  description: An energy revolver of alien origin. It is not known who manufactured it, but it reads SVX on the side of the gun.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Energy/energyrevolver.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Energy/energyrevolver.rsi
  - type: Item
    size: Normal
  - type: Gun
    shotsPerBurst: 2
    burstCooldown: 0.3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
  - type: RMCSelectiveFire
    scatterWielded: 4
    scatterUnwielded: 8
    baseFireRate: 2
    baseFireModes:
    - SemiAuto
    - Burst
    burstFireRateMultiplier: 5
    modifiers:
      Burst:
        useBurstScatterMult: false
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 1
  - type: RMCWeaponDamageFalloff
    falloffMultiplier: 0
  - type: WieldDelay
    baseDelay: 0.1
  - type: WieldableSpeedModifiers
    base: 1
    light: 1
    medium: 1
    heavy: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_unload.ogg
        priority: 2
        whitelist:
          tags:
          - SVXMagazinePlasmaSmall
  - type: GunDamageModifier
    multiplier: 2
  - type: Tag
    tags:
    - SVXWeaponAlienRevolver

- type: entity
  parent: CMMagazineRifleBase
  id: SVXMagazinePlasmaSmall
  name: "Small Energy magazine"
  description: "A 15-round magazine of standard plasma rounds."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - SVXMagazinePlasmaSmall
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - SVXProjectileEnergy
    proto: SVXCartridgeEnergy
    capacity: 15
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/energymagazine_small.rsi

- type: Tag
  id: SVXMagazinePlasmaSmall

- type: Tag
  id: SVXWeaponAlienRevolver